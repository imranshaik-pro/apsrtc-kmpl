name: APSRTC Daily Report
run-name: Daily ${{ github.event_name }} • ${{ github.event.schedule || inputs.report_date || 'current-date' }}

on:
  workflow_dispatch:
    inputs:
      depot:
        description: Depot key or display name
        required: true
        default: PRODDUTUR
      report_date:
        description: Optional selected date (YYYY-MM-DD). Today means yesterday; future dates are rejected.
        required: false
        default: ''
      hub_row:
        description: Automation Hub response row for report-link callback
        required: false
        default: ''
  schedule:
    # Use explicit Asia/Kolkata schedules rather than one compact UTC cron.
    # GitHub documents that scheduled events can be delayed or even dropped under load.
    # Stagger retry minutes to reduce dependence on a single recurring scheduler slot.
    # Target window: first attempt just after 05:00 IST, then roughly hourly through 11:00 IST.
    - cron: '7 5 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '11 6 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '17 7 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '23 8 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '29 9 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '35 10 * * *'
      timezone: 'Asia/Kolkata'
    - cron: '41 11 * * *'
      timezone: 'Asia/Kolkata'

permissions:
  contents: read

jobs:
  generate-daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Record trigger timing
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          now = datetime.now(timezone.utc)
          print('DAILY_TRIGGER_TIMING: ' + json.dumps({
              'event': os.environ['TRIGGER_EVENT'],
              'cron': os.environ.get('TRIGGER_CRON', ''),
              'started_utc': now.isoformat(),
              'started_ist': now.astimezone(ZoneInfo('Asia/Kolkata')).isoformat(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
          }))
          PY

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Validate daily tyre checks and date rules
        env:
          APSRTC_USERNAME: test-fixture
          APSRTC_PASSWORD: test-fixture
        run: |
          python -m py_compile src/reporting/daily_template.py src/reporting/telegram_daily.py run_automated_daily.py src/reporting/application.py src/reporting/tyre_checks.py src/integrations/google_drive.py
          python -m pytest -q tests/test_daily_tyre_checks.py tests/test_current_daily_tyres.py tests/test_daily_workflow.py tests/test_telegram_daily_visual.py tests/test_daily_template.py tests/test_daily_template_delivery.py

      - name: Generate and upload daily report
        id: daily_report
        env:
          APSRTC_USERNAME: ${{ secrets.APSRTC_USERNAME }}
          APSRTC_PASSWORD: ${{ secrets.APSRTC_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DAILY_DRIVE_FOLDER_ID: 1tU9aw7Cdw-Q-7mr9BMhayORKMy61_DOz
        shell: bash
        run: |
          set +e
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python run_automated_daily.py --depot PRODDUTUR --scheduled 2>&1 | tee /tmp/daily.log
            rc=${PIPESTATUS[0]}
            depot="PRODDUTUR"
          else
            ARGS=(--depot "${{ inputs.depot }}")
            if [ -n "${{ inputs.report_date }}" ]; then
              ARGS+=(--date "${{ inputs.report_date }}")
            fi
            python run_automated_daily.py "${ARGS[@]}" 2>&1 | tee /tmp/daily.log
            rc=${PIPESTATUS[0]}
            depot="${{ inputs.depot }}"
          fi

          report_date=$(sed -nE 's/^Report date: ([0-9]{4}-[0-9]{2}-[0-9]{2})$/\1/p' /tmp/daily.log | head -1)
          drive_link=$(sed -n 's/^DRIVE_LINK: //p' /tmp/daily.log | tail -1)
          already_link=$(sed -n 's/^ALREADY_DELIVERED: //p' /tmp/daily.log | tail -1)
          report_file=$(find reports -maxdepth 1 -type f -name '*.txt' -print -quit 2>/dev/null || true)
          [ -z "$drive_link" ] && drive_link="$already_link"
          if [ -n "$already_link" ]; then
            already_delivered="true"
          else
            already_delivered="false"
          fi

          echo "depot=$depot" >> "$GITHUB_OUTPUT"
          echo "report_date=$report_date" >> "$GITHUB_OUTPUT"
          echo "drive_link=$drive_link" >> "$GITHUB_OUTPUT"
          echo "report_file=$report_file" >> "$GITHUB_OUTPUT"
          echo "already_delivered=$already_delivered" >> "$GITHUB_OUTPUT"
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

          exit "$rc"

      - name: Write Daily report link back to Automation Hub
        if: success() && github.event_name == 'workflow_dispatch' && inputs.hub_row != ''
        env:
          HUB_CALLBACK_URL: ${{ secrets.HUB_CALLBACK_URL }}
          HUB_CALLBACK_TOKEN: ${{ secrets.HUB_CALLBACK_TOKEN }}
          HUB_ROW: ${{ inputs.hub_row }}
          REPORT_URL: ${{ steps.daily_report.outputs.drive_link }}
          DEPOT: ${{ steps.daily_report.outputs.depot }}
          REPORT_DATE: ${{ steps.daily_report.outputs.report_date }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url=os.environ.get("HUB_CALLBACK_URL","").strip()
          token=os.environ.get("HUB_CALLBACK_TOKEN","").strip()
          if not url or not token:
              print("HUB_CALLBACK_SKIPPED: callback secrets are not configured")
              raise SystemExit(0)
          payload=json.dumps({
              "token":token,
              "row":int(os.environ["HUB_ROW"]),
              "url":os.environ["REPORT_URL"],
              "status":f"COMPLETED | DAILY | {os.environ['DEPOT']} | {os.environ['REPORT_DATE']}"
          }).encode()
          req=urllib.request.Request(url,data=payload,headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as resp:
              result=json.loads(resp.read().decode())
          if not result.get("ok"):
              raise SystemExit("Automation Hub callback failed: "+str(result))
          print("AUTOMATION_HUB_LINK_UPDATED")
          PY

      - name: Send Daily report text to Telegram
        # Scheduled retries must not resend the same Daily report every hour.
        # Manual/Form dispatches may deliberately redeliver an existing report.
        if: success() && (github.event_name != 'schedule' || steps.daily_report.outputs.already_delivered != 'true')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPOT: ${{ steps.daily_report.outputs.depot }}
          REPORT_DATE: ${{ steps.daily_report.outputs.report_date }}
          DRIVE_LINK: ${{ steps.daily_report.outputs.drive_link }}
          REPORT_FILE: ${{ steps.daily_report.outputs.report_file }}
          CACHED_REPORT: ${{ steps.daily_report.outputs.already_delivered }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '').strip()
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '').strip()
          report_file = os.environ.get('REPORT_FILE', '').strip()
          if not token or not chat_id:
              raise SystemExit('Telegram secrets are missing.')
          body = ''
          if report_file and Path(report_file).is_file():
              body = Path(report_file).read_text(encoding='utf-8', errors='replace').strip()
          from src.reporting.telegram_daily import format_daily_telegram
          chunks = format_daily_telegram(
              body or 'Report generated successfully.',
              os.environ.get('DEPOT', ''), os.environ.get('REPORT_DATE', ''),
              os.environ.get('DRIVE_LINK', '').strip(),
              os.environ.get('CACHED_REPORT', '') == 'true',
          )
          for i, chunk in enumerate(chunks, 1):
              prefix = ('Part %d/%d\n\n' % (i, len(chunks))) if len(chunks) > 1 else ''
              data = urllib.parse.urlencode({'chat_id': chat_id, 'text': prefix + chunk, 'disable_web_page_preview': 'true', 'parse_mode': 'HTML'}).encode()
              req = urllib.request.Request('https://api.telegram.org/bot' + token + '/sendMessage', data=data, method='POST')
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              if not payload.get('ok'): raise SystemExit('Telegram Daily report delivery failed.')
          print('TELEGRAM_DAILY_REPORT_SENT: %d message(s)' % len(chunks))
          PY
      - name: Send Telegram failure notification
        if: failure() && steps.daily_report.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPOT: ${{ steps.daily_report.outputs.depot }}
          REPORT_DATE: ${{ steps.daily_report.outputs.report_date }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Telegram secrets are missing.")
          text = (
              "❌ APSRTC Daily Report Failed\n\n"
              f"Depot: {os.environ.get('DEPOT') or 'PRODDUTUR'}\n"
              f"Date: {os.environ.get('REPORT_DATE') or 'Not resolved'}\n"
              "Status: Report generation/upload failed. Check GitHub Actions."
          )
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
          req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data, method="POST")
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.load(response)
          if not payload.get("ok"):
              raise SystemExit("Telegram failure notification failed.")
          print("TELEGRAM_DAILY_FAILURE_SENT")
          PY

      - name: Upload generated report as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apsrtc-daily-report-${{ github.run_number }}
          path: |
            reports/*.txt
            reports/*.html
          if-no-files-found: ignore
          retention-days: 7
