name: August Range Source Diagnostic
on:
  push:
    branches: [fix/aug-2026-range-source]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      APSRTC_USERNAME: ${{ secrets.APSRTC_USERNAME }}
      APSRTC_PASSWORD: ${{ secrets.APSRTC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Inspect safe August range structures
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          import report_details as d
          import kmpl_ranges as k
          from monthly_vehicle_report import login
          s=login()
          from urllib.parse import urljoin
          for entity,endpoint in k.ENDPOINTS.items():
            selector=endpoint.replace("kmpldepot.php","kmpl1.php")
            selurl=f"{d.BASE}/med/{selector}"
            q=s.get(selurl,timeout=45);soup=BeautifulSoup(q.text,"html.parser")
            print("PARENT_SELECTOR",entity,selector,"FORMS",[(x.get("action"),x.get("method"),[(y.get("name"),y.get("value")) for y in x.find_all(["input","select"])]) for x in soup.find_all("form")])
            if soup.find("form"):
              parent=urljoin(selurl,soup.find("form").get("action"))
              p=s.post(parent,data={"yymm":"202608"},timeout=45);ps=BeautifulSoup(p.text,"html.parser")
              print("PARENT_POST",entity,parent,"ROWS",[len(t.find_all("tr")) for t in ps.find_all("table")],"LINKS",[(a.get_text(" ",strip=True),a.get("href")) for a in ps.find_all("a",href=True) if "YSR" in (a.get_text()+" "+a.get("href","")).upper()])
            r=s.get(f"{d.BASE}/med/{endpoint}",params={"action":"","yymm":"202608","rreg":"YSRKADAPA"},timeout=45);rs=BeautifulSoup(r.text,"html.parser")
            print("AFTER_PARENT",entity,"ROWS",[len(t.find_all("tr")) for t in rs.find_all("table")],"LEN",len(r.text))
            try:
              z=k.parse_range(r.text,entity,"PRODDUTUR","2026-08","YSRKADAPA","MONTH");print("AFTER_PARENT_VALID",entity,z["counts"])
            except Exception as e:print("AFTER_PARENT_INVALID",entity,str(e)[:250])
          PY
