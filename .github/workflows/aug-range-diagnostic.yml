name: August Range Source Diagnostic
on:
  push:
    branches: [fix/aug-2026-range-source]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      APSRTC_USERNAME: ${{ secrets.APSRTC_USERNAME }}
      APSRTC_PASSWORD: ${{ secrets.APSRTC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Inspect safe August range structures
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          import report_details as d
          import kmpl_ranges as k
          from monthly_vehicle_report import login
          s=login()
          from urllib.parse import urljoin
          def b(v):
            if v<3:return 0
            if v<=4:return 1
            if v<=5:return 2
            if v<=5.15:return 3
            if v<=5.30:return 4
            if v<=5.60:return 5
            return 6
          for entity,ep in (("VEHICLE","vehlog_kmplveh.php"),("DRIVER","drvlog_kmpldrv.php")):
            q=s.get(f"{d.BASE}/med/{ep}",params={"action":"","yymm":"202608","rreg":"PRODDUTUR"},timeout=45);soup=BeautifulSoup(q.text,"html.parser")
            vals=[];zero=[]
            for tr in soup.find("table").find_all("tr"):
              cells=tr.find_all("td")
              if not cells:continue
              try:
                if entity=="VEHICLE":
                  v=float(cells[13].get_text(strip=True)); km=float(cells[6].get_text(strip=True)); ident=cells[2].get_text(" ",strip=True)
                else:
                  v=float(cells[-1].get_text(strip=True)); km=float(cells[-3].get_text(strip=True)); ident=cells[1].get_text(" ",strip=True)
                vals.append((v,km,ident))
                if v==0:zero.append((ident,km,[c.get_text(" ",strip=True) for c in cells]))
              except:pass
            for name,pred in (("ALL",lambda x:True),("KM_POSITIVE",lambda x:x[1]>0),("HSD_KMPL_POSITIVE",lambda x:x[0]>0)):
              a=[0]*7;used=[x for x in vals if pred(x)]
              for v,km,_ in used:a[b(v)]+=1
              print("EXACT_BUCKETS",entity,name,a,sum(a))
            print("ZERO_DETAIL",entity,zero)
          PY
