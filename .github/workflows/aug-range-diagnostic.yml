name: August Range Source Diagnostic
on:
  push:
    branches: [fix/aug-2026-range-source]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      APSRTC_USERNAME: ${{ secrets.APSRTC_USERNAME }}
      APSRTC_PASSWORD: ${{ secrets.APSRTC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Inspect safe August range structures
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          import report_details as d
          import kmpl_ranges as k
          from monthly_vehicle_report import login
          s=login()
          for entity in ("VEHICLE","DRIVER"):
            for scope in ("MONTH","UPTO"):
              path=(k.UPTO_SELECTORS[entity] if scope=="UPTO" else ("vehlog_kmpl.php" if entity=="VEHICLE" else "drvlog_kmpl.php"))
              q=s.get(f"{d.BASE}/med/{path}",timeout=45)
              soup=BeautifulSoup(q.text,"html.parser")
              print("FORM_PAGE",entity,scope,path,"FORMS",len(soup.find_all("form")))
              for form in soup.find_all("form"):
                print("FORM",entity,scope,"method",form.get("method"),"action",form.get("action"),"inputs",[(x.get("name"),x.get("type"),x.get("value") if x.get("type") in ("hidden","submit") else None) for x in form.find_all("input")],"selects",[(x.get("name"),[(o.get("value"),o.get_text(" ",strip=True)) for o in x.find_all("option")[:4]]) for x in form.find_all("select")])
          for path in ("vehlog_kmpl.php","drvlog_kmpl.php","drvlog_ckmpl.php"):
            q=s.get(f"{d.BASE}/med/{path}",timeout=45)
            soup=BeautifulSoup(q.text,"html.parser")
            print("PAGE",path,"TITLE",soup.title.get_text(" ",strip=True) if soup.title else None)
            for tag in soup.find_all(["input","select","button","a"]):
              if tag.name=="a" and not any(t in str(tag.get("href","")).lower() for t in ("kmpl","log")):continue
              print("CONTROL",path,tag.name,"name",tag.get("name"),"id",tag.get("id"),"type",tag.get("type"),"value",tag.get("value"),"href",tag.get("href"),"onclick",str(tag.get("onclick"))[:200],"options",[(o.get("value"),o.get_text(" ",strip=True)) for o in tag.find_all("option")[:6]])
            for sc in soup.find_all("script"):
              txt=sc.get_text(" ",strip=True)
              if any(x in txt.lower() for x in ("yymm","rreg","action","submit","kmpldepot")):
                print("SCRIPT",path,txt[:2500])
          for path in ("vehlog_kmpl.php","drvlog_kmpl.php","drvlog_ckmpl.php","vehlog_kmpldepot.php?action=&yymm=202609&rreg=YSRKADAPA"):
            q=s.get(f"{d.BASE}/med/{path}",timeout=45)
            soup=BeautifulSoup(q.text,"html.parser")
            for tag in soup(["script","style"]):tag.decompose()
            txt=soup.get_text(" ",strip=True)
            print("BODY",path,"LEN",len(txt),"START",txt[:1600],"END",txt[-500:])
            print("LINKS",path,[(a.get_text(" ",strip=True),a.get("href")) for a in soup.find_all("a",href=True)[:18]])
            print("COOKIES",path,sorted(s.cookies.keys()))
          for month in ("202608","202609"):
            for entity in ("VEHICLE","DRIVER"):
              for scope in ("MONTH","UPTO"):
                selector=k.UPTO_SELECTORS[entity] if scope=="UPTO" else ("vehlog_kmpl.php" if entity=="VEHICLE" else "drvlog_kmpl.php")
                s.get(f"{d.BASE}/med/{selector}",timeout=45).raise_for_status()
                endpoint=(k.ENDPOINTS if scope=="MONTH" else k.UPTO_ENDPOINTS)[entity]
                for attempt in range(1,4):
                  q=s.get(f"{d.BASE}/med/{endpoint}",params={"action":"","yymm":month,"rreg":"YSRKADAPA"},timeout=45)
                  soup=BeautifulSoup(q.text,"html.parser")
                  rows=[len(t.find_all("tr")) for t in soup.find_all("table")]
                  print("RETRY_PROBE",month,entity,scope,attempt,"ROWS",rows,"LEN",len(q.text))
                  if max(rows or [0])>2:
                    print("RETRY_SAMPLE",month,entity,scope,[[c.get_text(" ",strip=True) for c in tr.find_all(["th","td"],recursive=False)] for tr in soup.find("table").find_all("tr")[-2:]])
                    break
          for month in ("202609","202608","202607"):
            print("COMPARISON_MONTH",month)
            for entity in ("VEHICLE","DRIVER"):
              for scope in ("MONTH","UPTO"):
                if scope=="UPTO":
                  q=s.get(f"{d.BASE}/med/{k.UPTO_SELECTORS[entity]}",timeout=45);q.raise_for_status()
                ep=(k.ENDPOINTS if scope=="MONTH" else k.UPTO_ENDPOINTS)[entity]
                r=s.get(f"{d.BASE}/med/{ep}",params={"action":"","yymm":month,"rreg":"YSRKADAPA"},timeout=45);r.raise_for_status()
                soup=BeautifulSoup(r.text,"html.parser")
                headings=[d.norm(h.get_text(" ",strip=True)) for h in soup.find_all(re.compile(r"^h[1-6]$"))]
                tables=soup.find_all("table")
                data=[t.find_all("tr") for t in tables]
                print("COMPARE",month,entity,scope,"HEADINGS",headings,"ROWS",[len(x) for x in data],"TEXTLEN",len(r.text),"URL",r.url)
                for ti,rows in enumerate(data):
                  if len(rows)>2:
                    print("DATA_SAMPLE",month,entity,scope,ti,[[c.get_text(" ",strip=True) for c in tr.find_all(["th","td"],recursive=False)][:3] for tr in rows[2:4]])
                try:
                  z=k.parse_range(r.text,entity,"PRODDUTUR",month[:4]+"-"+month[4:],"YSRKADAPA",scope)
                  print("PARSED",month,entity,scope,z["counts"])
                except Exception as e:
                  print("PARSE_ERROR",month,entity,scope,str(e)[:180])
          PY
