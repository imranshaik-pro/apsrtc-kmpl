name: August Range Source Diagnostic
on:
  push:
    branches: [fix/aug-2026-range-source]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      APSRTC_USERNAME: ${{ secrets.APSRTC_USERNAME }}
      APSRTC_PASSWORD: ${{ secrets.APSRTC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Inspect safe August range structures
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          import report_details as d
          import kmpl_ranges as k
          from monthly_vehicle_report import login
          s=login()
          from urllib.parse import urljoin
          def bucket(v):
            if v < 3.00:return 0
            if v <= 4.00:return 1
            if v <= 5.00:return 2
            if v <= 5.15:return 3
            if v <= 5.30:return 4
            if v <= 5.60:return 5
            return 6
          for entity,ep in (("VEHICLE","vehlog_kmplveh.php"),("DRIVER","drvlog_kmpldrv.php")):
            q=s.get(f"{d.BASE}/med/{ep}",params={"action":"","yymm":"202608","rreg":"PRODDUTUR"},timeout=45)
            soup=BeautifulSoup(q.text,"html.parser");table=soup.find("table")
            rows=[]
            for tr in table.find_all("tr"):
              cells=[c.get_text(" ",strip=True) for c in tr.find_all(["th","td"],recursive=False)]
              if cells: rows.append(cells)
            print("DRILL_HEADERS",entity,rows[:3])
            vals=[]
            for row in rows:
              try:
                v=float(row[-3] if entity=="VEHICLE" else row[-1])
                vals.append(v)
              except: pass
            for mode,keep in (("ALL",lambda v:True),("POSITIVE",lambda v:v>0)):
              counts=[0]*7
              used=[v for v in vals if keep(v)]
              for v in used:counts[bucket(v)]+=1
              print("DRILL_BUCKETS",entity,mode,counts,sum(counts),"ZEROS",sum(v==0 for v in vals),"VALUES",len(vals))
          for ep in ("vehlog_ckmplveh.php","drvlog_ckmpldrv.php"):
            try:
              q=s.get(f"{d.BASE}/med/{ep}",params={"action":"","yymm":"202608","rreg":"PRODDUTUR"},timeout=45)
              soup=BeautifulSoup(q.text,"html.parser")
              print("UPTO_DRILL",ep,q.status_code,len(q.text),[len(t.find_all("tr")) for t in soup.find_all("table")],soup.get_text(" ",strip=True)[:700])
            except Exception as e:print("UPTO_DRILL_ERROR",ep,repr(e))
          PY
