name: August Range Source Diagnostic
on:
  push:
    branches: [fix/aug-2026-range-source]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      APSRTC_USERNAME: ${{ secrets.APSRTC_USERNAME }}
      APSRTC_PASSWORD: ${{ secrets.APSRTC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Inspect safe August range structures
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          import report_details as d
          import kmpl_ranges as k
          from monthly_vehicle_report import login
          s=login()
          from urllib.parse import urljoin
          candidates=["vehlog_kmplveh.php","drvlog_kmpldrv.php","drvlog_kmplveh.php","drvlog_kmpldriver.php"]
          for ep in candidates:
            try:
              q=s.get(f"{d.BASE}/med/{ep}",params={"action":"","yymm":"202608","rreg":"PRODDUTUR"},timeout=45)
              soup=BeautifulSoup(q.text,"html.parser")
              print("DRILL",ep,"STATUS",q.status_code,"LEN",len(q.text),"ROWS",[len(t.find_all("tr")) for t in soup.find_all("table")],
                    "HEAD",[d.norm(h.get_text(" ",strip=True)) for h in soup.find_all(re.compile(r"^h[1-6]$"))],
                    "TEXT",soup.get_text(" ",strip=True)[:1000])
            except Exception as e: print("DRILL_ERROR",ep,repr(e))
          PY
