name: Depot range source review
on:
  push:
    branches: [feat/depot-only-range-upto-20261003]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Read observed range source forms
        env:
          APSRTC_USERNAME: ${{ secrets.APSRTC_USERNAME }}
          APSRTC_PASSWORD: ${{ secrets.APSRTC_PASSWORD }}
        run: python range_source_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depot-range-source
          path: reports/depot-range-source
          retention-days: 3
