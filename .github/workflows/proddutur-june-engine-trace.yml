name: Proddatur June Engine Source Trace
on:
  push:
    branches: [fix/proddutur-june-upto-history]
    paths:
      - diagnose_proddutur_june_engine.py
      - .github/workflows/proddutur-june-engine-trace.yml
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APSRTC_USERNAME: ${{ secrets.APSRTC_USERNAME }}
      APSRTC_PASSWORD: ${{ secrets.APSRTC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Read engine source tables for Proddatur June 2026
        run: python diagnose_proddutur_june_engine.py
