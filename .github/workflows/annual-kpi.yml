name: Annual KPI Dashboard

on:
  push:
    branches: [master]
    paths: ['.github/workflows/annual-kpi.yml']
  workflow_dispatch:
    inputs:
      depot:
        description: Depot name
        required: true
        default: PRODDUTUR
      selected_month:
        description: Selected report month (YYYY-MM)
        required: true
      financial_years:
        description: Financial year derived from selected month (YYYY-YY)
        required: true
      hub_row:
        description: Automation Hub response row for report-link callback
        required: false
        default: ''

jobs:
  annual-kpi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APSRTC_USERNAME: ${{ secrets.APSRTC_USERNAME }}
      APSRTC_PASSWORD: ${{ secrets.APSRTC_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      KPI_DRIVE_FOLDER_ID: 1uQlJJcrv7TbKAXtkFtrrCqZac31aWqL9

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Annual Python syntax
        run: |
          python -m py_compile annual_kpi_runner_v7.py annual_kpi_runner_v10.py annual_kpi_runner_v11.py

      - name: Show annual KPI request
        run: |
          echo "Depot: ${{ inputs.depot || 'RAJAMPET' }}"
          echo "Selected month: ${{ inputs.selected_month || '2026-06' }}"
          echo "Financial year: ${{ inputs.financial_years || '2026-27' }}"

      - name: Build or repair annual KPI dashboard
        shell: bash
        run: |
          set -o pipefail
          python annual_kpi_runner_v11.py \
            --depot "${{ inputs.depot || 'RAJAMPET' }}" \
            --years "${{ inputs.financial_years || '2026-27' }}" \
            --selected-month "${{ inputs.selected_month || '2026-06' }}" | tee annual-kpi.log
          REPORT_URL="$(grep -Eo 'https://(docs|drive)\.google\.com/[^[:space:]]+' annual-kpi.log | tail -1)"
          if [ -z "$REPORT_URL" ]; then
            echo "Annual KPI Google Sheet link was not emitted by the report generator."
            exit 1
          fi
          echo "REPORT_URL=$REPORT_URL" >> "$GITHUB_ENV"

      - name: Write Annual report link back to Automation Hub
        if: success() && inputs.hub_row != ''
        env:
          HUB_CALLBACK_URL: ${{ secrets.HUB_CALLBACK_URL }}
          HUB_CALLBACK_TOKEN: ${{ secrets.HUB_CALLBACK_TOKEN }}
          HUB_ROW: ${{ inputs.hub_row }}
          REPORT_URL: ${{ env.REPORT_URL }}
          DEPOT: ${{ inputs.depot || 'RAJAMPET' }}
          SELECTED_MONTH: ${{ inputs.selected_month || '2026-06' }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url=os.environ.get("HUB_CALLBACK_URL","").strip()
          token=os.environ.get("HUB_CALLBACK_TOKEN","").strip()
          if not url or not token:
              print("HUB_CALLBACK_SKIPPED: callback secrets are not configured")
              raise SystemExit(0)
          payload=json.dumps({
              "token":token,
              "row":int(os.environ["HUB_ROW"]),
              "url":os.environ["REPORT_URL"],
              "status":f"COMPLETED | ANNUAL KPI | {os.environ['DEPOT']} | {os.environ['SELECTED_MONTH']}"
          }).encode()
          req=urllib.request.Request(url,data=payload,headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as resp:
              result=json.loads(resp.read().decode())
          if not result.get("ok"):
              raise SystemExit("Automation Hub callback failed: "+str(result))
          print("AUTOMATION_HUB_LINK_UPDATED")
          PY

      - name: Send Annual KPI success to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPOT: ${{ inputs.depot || 'RAJAMPET' }}
          SELECTED_MONTH: ${{ inputs.selected_month || '2026-06' }}
          REPORT_URL: ${{ env.REPORT_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.environ.get("TELEGRAM_BOT_TOKEN","").strip()
          chat_id=os.environ.get("TELEGRAM_CHAT_ID","").strip()
          if not token or not chat_id:
              raise SystemExit("Telegram secrets are missing.")
          text=(
              "✅ APSRTC ANNUAL KPI REPORT COMPLETED\n\n"
              f"Depot: {os.environ.get('DEPOT','')}\n"
              f"Selected Month: {os.environ.get('SELECTED_MONTH','')}\n"
              "Status: Annual KPI dashboard generated/refreshed successfully.\n\n"
              f"Open Report: {os.environ.get('REPORT_URL','')}"
          )
          data=urllib.parse.urlencode({"chat_id":chat_id,"text":text}).encode()
          req=urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage",data=data,method="POST")
          with urllib.request.urlopen(req,timeout=20) as response:
              payload=json.load(response)
          if not payload.get("ok"):
              raise SystemExit("Telegram Annual KPI status delivery failed.")
          print("TELEGRAM_ANNUAL_KPI_STATUS_SENT")
          PY

      - name: Send Annual KPI failure to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPOT: ${{ inputs.depot || 'RAJAMPET' }}
          SELECTED_MONTH: ${{ inputs.selected_month || '2026-06' }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.environ.get("TELEGRAM_BOT_TOKEN","").strip()
          chat_id=os.environ.get("TELEGRAM_CHAT_ID","").strip()
          if not token or not chat_id:
              raise SystemExit("Telegram secrets are missing.")
          text=(
              "❌ APSRTC ANNUAL KPI REPORT FAILED\n\n"
              f"Depot: {os.environ.get('DEPOT','')}\n"
              f"Selected Month: {os.environ.get('SELECTED_MONTH','')}\n"
              "Status: Annual KPI generation/refresh failed. Check GitHub Actions."
          )
          data=urllib.parse.urlencode({"chat_id":chat_id,"text":text}).encode()
          req=urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage",data=data,method="POST")
          with urllib.request.urlopen(req,timeout=20) as response:
              payload=json.load(response)
          if not payload.get("ok"):
              raise SystemExit("Telegram Annual KPI failure delivery failed.")
          print("TELEGRAM_ANNUAL_KPI_FAILURE_SENT")
          PY

      - name: Upload XLSX backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annual-kpi-${{ inputs.depot || 'RAJAMPET' }}-${{ inputs.selected_month || '2026-06' }}
          path: reports/*ANNUAL_KPI*.xlsx
          if-no-files-found: ignore
          retention-days: 7
