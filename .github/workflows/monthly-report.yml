name: APSRTC Monthly Report

on:
  workflow_dispatch:
    inputs:
      depot:
        description: Depot key or display name
        required: true
        default: PRODDUTUR
      month:
        description: Report month (YYYY-MM)
        required: true
      hub_row:
        description: Automation Hub response row for report-link callback
        required: false
        default: ''

permissions:
  contents: read

jobs:
  generate-monthly-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate monthly detail source and history contracts
        env:
          APSRTC_USERNAME: offline
          APSRTC_PASSWORD: offline
        run: |
          python -m py_compile monthly_vehicle_report.py report_details.py report_tyre_template.py
          python -m unittest discover -s tests -p 'test_report_details.py' -v
          python -m unittest discover -s tests -p 'test_tyre_template.py' -v

      - name: Generate and upload monthly Google Sheet
        env:
          APSRTC_USERNAME: ${{ secrets.APSRTC_USERNAME }}
          APSRTC_PASSWORD: ${{ secrets.APSRTC_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          VEHICLE_EVENTS_API_URL: ${{ secrets.VEHICLE_EVENTS_API_URL }}
          VEHICLE_EVENTS_API_KEY: ${{ secrets.VEHICLE_EVENTS_API_KEY }}
          MONTHLY_DRIVE_FOLDER_ID: 1O6rKH39INogYxsNI9IepEO9UJq1MMnPj
        shell: bash
        run: |
          set -o pipefail
          python monthly_vehicle_report.py \
            --depot "${{ inputs.depot }}" \
            --month "${{ inputs.month }}" | tee monthly-report.log
          REPORT_URL="$(grep -Eo 'https://(docs|drive)\.google\.com/[^[:space:]]+' monthly-report.log | tail -1)"
          if [ -z "$REPORT_URL" ]; then
            echo "Monthly Google Sheet link was not emitted by the report generator."
            exit 1
          fi
          echo "REPORT_URL=$REPORT_URL" >> "$GITHUB_ENV"

      - name: Write Monthly report link back to Automation Hub
        if: success() && inputs.hub_row != ''
        env:
          HUB_CALLBACK_URL: ${{ secrets.HUB_CALLBACK_URL }}
          HUB_CALLBACK_TOKEN: ${{ secrets.HUB_CALLBACK_TOKEN }}
          HUB_ROW: ${{ inputs.hub_row }}
          REPORT_URL: ${{ env.REPORT_URL }}
          DEPOT: ${{ inputs.depot }}
          REPORT_MONTH: ${{ inputs.month }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url=os.environ.get("HUB_CALLBACK_URL","").strip()
          token=os.environ.get("HUB_CALLBACK_TOKEN","").strip()
          if not url or not token:
              print("HUB_CALLBACK_SKIPPED: callback secrets are not configured")
              raise SystemExit(0)
          payload=json.dumps({
              "token":token,
              "row":int(os.environ["HUB_ROW"]),
              "url":os.environ["REPORT_URL"],
              "status":f"COMPLETED | MONTHLY | {os.environ['DEPOT']} | {os.environ['REPORT_MONTH']}"
          }).encode()
          req=urllib.request.Request(url,data=payload,headers={"Content-Type":"application/json"},method="POST")
          with urllib.request.urlopen(req,timeout=30) as resp:
              result=json.loads(resp.read().decode())
          if not result.get("ok"):
              raise SystemExit("Automation Hub callback failed: "+str(result))
          print("AUTOMATION_HUB_LINK_UPDATED")
          PY

      - name: Send Monthly report status to Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPOT: ${{ inputs.depot }}
          REPORT_MONTH: ${{ inputs.month }}
          REPORT_URL: ${{ env.REPORT_URL }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Telegram secrets are missing.")
          text = (
              "✅ APSRTC MONTHLY REPORT COMPLETED\n\n"
              f"Depot: {os.environ.get('DEPOT','')}\n"
              f"Month: {os.environ.get('REPORT_MONTH','')}\n"
              "Status: Monthly Google Sheet generated/uploaded successfully to Google Drive.\n\n"
              f"Open Report: {os.environ.get('REPORT_URL','')}"
          )
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage", data=data, method="POST"
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.load(response)
          if not payload.get("ok"):
              raise SystemExit("Telegram Monthly status delivery failed.")
          print("TELEGRAM_MONTHLY_STATUS_SENT")
          PY

      - name: Send Monthly failure status to Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPOT: ${{ inputs.depot }}
          REPORT_MONTH: ${{ inputs.month }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Telegram secrets are missing.")
          text = (
              "❌ APSRTC MONTHLY REPORT FAILED\n\n"
              f"Depot: {os.environ.get('DEPOT','')}\n"
              f"Month: {os.environ.get('REPORT_MONTH','')}\n"
              "Status: Monthly report generation/upload failed. Check GitHub Actions."
          )
          data = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage", data=data, method="POST"
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              payload = json.load(response)
          if not payload.get("ok"):
              raise SystemExit("Telegram Monthly failure delivery failed.")
          print("TELEGRAM_MONTHLY_FAILURE_SENT")
          PY

      - name: Upload XLSX backup as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apsrtc-monthly-report-${{ github.run_number }}
          path: reports/*.xlsx
          if-no-files-found: ignore
          retention-days: 7
