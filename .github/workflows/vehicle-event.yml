name: Vehicle Event Trigger

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: Event ID from the Google Form register
        required: false
      created_at:
        description: Created timestamp
        required: false
      event_date:
        description: Event date (YYYY-MM-DD)
        required: true
      depot:
        description: Depot
        required: true
        default: PRODDUTUR
      vehicle_no:
        description: Vehicle number
        required: true
      event_type:
        description: Vehicle event type
        required: true
        type: choice
        options:
          - UNIT CHANGE
          - BREAKDOWN
          - TYRE CHANGE
          - SCHEDULE III
          - SCHEDULE IV
      components:
        description: Pipe-separated changed components
        required: false
      spring_positions:
        description: Pipe-separated spring positions
        required: false
      tyre_history:
        description: Position-to-tyre-number history
        required: false
      breakdown_location:
        description: Breakdown location
        required: false
      kms_cancelled:
        description: KMs cancelled
        required: false
      breakdown_details:
        description: Breakdown details
        required: false
      remarks:
        description: Remarks
        required: false
      entry_source:
        description: Entry source
        required: false
        default: GOOGLE_FORM

permissions:
  contents: read

jobs:
  validate-event:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate normalized vehicle event
        env:
          EVENT_ID: ${{ inputs.event_id }}
          CREATED_AT: ${{ inputs.created_at }}
          EVENT_DATE: ${{ inputs.event_date }}
          DEPOT: ${{ inputs.depot }}
          VEHICLE_NO: ${{ inputs.vehicle_no }}
          EVENT_TYPE: ${{ inputs.event_type }}
          COMPONENTS: ${{ inputs.components }}
          SPRING_POSITIONS: ${{ inputs.spring_positions }}
          TYRE_HISTORY: ${{ inputs.tyre_history }}
          BREAKDOWN_LOCATION: ${{ inputs.breakdown_location }}
          KMS_CANCELLED: ${{ inputs.kms_cancelled }}
          BREAKDOWN_DETAILS: ${{ inputs.breakdown_details }}
          REMARKS: ${{ inputs.remarks }}
          ENTRY_SOURCE: ${{ inputs.entry_source }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          payload = {
              "Event ID": os.environ.get("EVENT_ID", ""),
              "Created At": os.environ.get("CREATED_AT", ""),
              "Event Date": os.environ["EVENT_DATE"],
              "Depot": os.environ["DEPOT"],
              "Vehicle No": os.environ["VEHICLE_NO"],
              "Event Type": os.environ["EVENT_TYPE"],
              "Components": os.environ.get("COMPONENTS", ""),
              "Spring Positions": os.environ.get("SPRING_POSITIONS", ""),
              "Tyre History": os.environ.get("TYRE_HISTORY", ""),
              "Breakdown Location": os.environ.get("BREAKDOWN_LOCATION", ""),
              "KM Cancelled": os.environ.get("KMS_CANCELLED", ""),
              "Breakdown Details": os.environ.get("BREAKDOWN_DETAILS", ""),
              "Remarks": os.environ.get("REMARKS", ""),
              "Entry Source": os.environ.get("ENTRY_SOURCE", "GOOGLE_FORM"),
          }
          subprocess.run(
              ["python", "record_vehicle_event.py", "--payload", json.dumps(payload),
               "--source", os.environ.get("ENTRY_SOURCE", "GOOGLE_FORM")],
              check=True,
          )
          PY
      - name: Preserve normalized event artifact
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-event-${{ inputs.vehicle_no }}-${{ inputs.event_date }}
          path: reports/vehicle_event_register.csv
          retention-days: 7
