name: Telegram Notification Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token:
              raise SystemExit("ERROR: TELEGRAM_BOT_TOKEN secret is missing.")
          if not chat_id:
              raise SystemExit("ERROR: TELEGRAM_CHAT_ID secret is missing.")

          text = (
              "✅ APSRTC Automation\n\n"
              "Telegram connection successful.\n"
              "Daily, Monthly and Annual report notifications can now be delivered here."
          )
          data = urllib.parse.urlencode({
              "chat_id": chat_id,
              "text": text,
          }).encode()

          request = urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=data,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)

          if not payload.get("ok"):
              raise SystemExit("ERROR: Telegram sendMessage failed.")
          print("TELEGRAM_TEST_SUCCESS")
          PY
