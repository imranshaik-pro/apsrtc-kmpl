name: Reconcile PRODDUTUR Aug range populations final verified

on:
  push:
    branches: [master]
    paths: ['.github/workflows/reconcile-proddutur-aug.yml']

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APSRTC_USERNAME: ${{ secrets.APSRTC_USERNAME }}
      APSRTC_PASSWORD: ${{ secrets.APSRTC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - name: Run range regression suite
        run: python -m unittest tests.test_kmpl_ranges -v
      - name: Capture record-level August and September evidence
        run: |
          python - <<'PY'
          import collections
          from bs4 import BeautifulSoup
          import report_details as d
          from src.auth.client import login
          from kmpl_ranges import SourceAdapter
          s=login()
          a=SourceAdapter(s,"PRODDUTUR","YSRKADAPA")
          def rows(ep,period,entity):
              h=a._get_detail(ep,period).text
              out=[]
              for tr in BeautifulSoup(h,"html.parser").find_all("tr"):
                  c=tr.find_all("td")
                  try:
                      if entity=="VEHICLE":
                          ident=d.norm(c[2].get_text(" ",strip=True)); kms=float(c[6].get_text(strip=True).replace(",","")); kmpl=float(c[13].get_text(strip=True).replace(",",""))
                          if kms<=0: continue
                      else:
                          ident=d.norm(c[1].get_text(" ",strip=True)); kms=None; kmpl=float(c[-1].get_text(strip=True).replace(",",""))
                          if not ident: continue
                  except (ValueError,IndexError): continue
                  out.append((ident,kms,kmpl))
              return out
          for period in ("2026-08","2026-09"):
              for entity,ep in (("VEHICLE","vehlog_kmplveh.php"),("DRIVER","drvlog_kmpldrv.php")):
                  rr=rows(ep,period,entity)
                  ids=collections.Counter(x[0] for x in rr)
                  exact=collections.Counter(rr)
                  print("RECON",period,entity,"ROWS",len(rr),"UNIQUE_IDS",len(ids),"DUP_IDS",[(k,v) for k,v in ids.items() if v>1],"EXACT_DUPS",[(k,v) for k,v in exact.items() if v>1])
                  print("RECORDS",period,entity,rr)
          PY
          # Vehicle rows excluded by the current positive-operated-KM fallback.
          python - <<'PY'
          from bs4 import BeautifulSoup
          import report_details as d
          from src.auth.client import login
          from kmpl_ranges import SourceAdapter
          a=SourceAdapter(login(),"PRODDUTUR","YSRKADAPA")
          for period in ("2026-08","2026-09"):
              h=a._get_detail("vehlog_kmplveh.php",period).text
              excluded=[]
              for tr in BeautifulSoup(h,"html.parser").find_all("tr"):
                  c=tr.find_all("td")
                  try:
                      ident=d.norm(c[2].get_text(" ",strip=True)); kms=float(c[6].get_text(strip=True).replace(",","")); kmpl=float(c[13].get_text(strip=True).replace(",",""))
                  except (ValueError,IndexError): continue
                  if ident and kms<=0: excluded.append((ident,kms,kmpl,[x.get_text(" ",strip=True) for x in c]))
              print("VEHICLE_EXCLUDED",period,excluded)
          PY
          python - <<'PY'
          from src.auth.client import login
          from kmpl_ranges import SourceAdapter, parse_range
          a=SourceAdapter(login(),"PRODDUTUR","YSRKADAPA")
          for entity in ("VEHICLE","DRIVER"):
              try:
                  snap=a(entity,"2026-08","MONTH")
                  print("LIVE_AGGREGATE_OR_FALLBACK",entity,snap["counts"],snap.get("source_method"),snap.get("source"))
              except Exception as e:
                  print("LIVE_AGGREGATE_ERROR",entity,type(e).__name__,str(e))
          PY
          python - <<'PY'
          from bs4 import BeautifulSoup
          from src.auth.client import login
          from kmpl_ranges import SourceAdapter
          a=SourceAdapter(login(),"PRODDUTUR","YSRKADAPA")
          for period in ("2026-08","2026-09"):
              h=a._get_detail("drvlog_kmpldrv.php",period).text
              for tr in BeautifulSoup(h,"html.parser").find_all("tr"):
                  c=tr.find_all("td")
                  if len(c)>1 and c[1].get_text(" ",strip=True)=="411856":
                      print("DUP_DRIVER_FULL",period,[x.get_text(" ",strip=True) for x in c])
          PY
          python - <<'PY'
          from bs4 import BeautifulSoup
          import report_details as d
          from src.auth.client import login
          from kmpl_ranges import SourceAdapter
          a=SourceAdapter(login(),"PRODDUTUR","YSRKADAPA")
          for entity,ep in (("VEHICLE","vehlog_kmplveh.php"),("DRIVER","drvlog_kmpldrv.php")):
              h=a._get_detail(ep,"2026-08").text
              vals=[]
              for tr in BeautifulSoup(h,"html.parser").find_all("tr"):
                  c=tr.find_all("td",recursive=False)
                  try:
                      if entity=="VEHICLE":
                          ident=d.norm(c[2].get_text(" ",strip=True)); kms=float(c[6].get_text(strip=True).replace(",","")); kmpl=float(c[13].get_text(strip=True).replace(",",""))
                          if kms<=0: continue
                      else:
                          ident=d.norm(c[1].get_text(" ",strip=True)); kmpl=float(c[-1].get_text(strip=True).replace(",",""))
                          if not ident: continue
                  except (ValueError,IndexError): continue
                  vals.append((ident,kmpl))
              bins=[0]*7
              for _,v in vals:
                  i=0 if v<3 else 1 if v<=4 else 2 if v<=5 else 3 if v<=5.15 else 4 if v<=5.30 else 5 if v<=5.60 else 6
                  bins[i]+=1
              print("NONRECURSIVE_RESULT",entity,bins+[len(vals)],"FIRST_LAST",vals[:2],vals[-2:])
          PY
          python - <<'PY'
          from bs4 import BeautifulSoup
          from src.auth.client import login
          from kmpl_ranges import SourceAdapter
          a=SourceAdapter(login(),"PRODDUTUR","YSRKADAPA")
          for entity,ep in (("VEHICLE","vehlog_kmplveh.php"),("DRIVER","drvlog_kmpldrv.php")):
              soup=BeautifulSoup(a._get_detail(ep,"2026-08").text,"html.parser")
              for n,t in enumerate(soup.find_all("table")):
                  direct=t.find_all("tr",recursive=False); allr=t.find_all("tr")
                  sample=[]
                  for tr in allr[:3]: sample.append([c.get_text(" ",strip=True) for c in tr.find_all(["th","td"],recursive=False)])
                  print("TABLE_SHAPE",entity,n,t.get("id"),t.get("class"),"DIRECT",len(direct),"ALL",len(allr),"SAMPLE",sample)
          PY
          python - <<'PY'
          from bs4 import BeautifulSoup
          from src.auth.client import login
          from kmpl_ranges import SourceAdapter
          a=SourceAdapter(login(),"PRODDUTUR","YSRKADAPA")
          soup=BeautifulSoup(a._get_detail("drvlog_kmpldrv.php","2026-08").text,"html.parser")
          for i,tr in enumerate(soup.find("table").find_all("tr")[:8]):
              rec=tr.find_all("td"); direct=tr.find_all("td",recursive=False)
              print("DRIVER_ROW_SHAPE",i,"REC",len(rec),[c.get_text(" ",strip=True)[:40] for c in rec[:8]],"DIRECT",len(direct),[c.get_text(" ",strip=True)[:40] for c in direct[:8]])
          PY
