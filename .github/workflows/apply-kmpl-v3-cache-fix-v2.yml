name: Apply KMPL v3 cache reset fix v2

on:
  push:
    branches: [fix/kmpl-v3-cache-reset-20261015]
    paths:
      - '.github/workflows/apply-kmpl-v3-cache-fix-v2.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply guarded cache compatibility patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('kmpl_ranges.py')
          text = source.read_text()
          old = 'SCHEMA = "kmpl-range-3"\nMONTHLY_TITLE = "KMPL Range Distribution"'
          new = 'SCHEMA = "kmpl-range-3"\nLEGACY_RESET_SCHEMAS = {"kmpl-range-2"}\nMONTHLY_TITLE = "KMPL Range Distribution"'
          if text.count(old) != 1:
              raise SystemExit('SCHEMA anchor changed; refusing unguarded patch')
          text = text.replace(old, new)

          old = '''def decode(rows, depot):
              if not rows or len(rows[0]) < 4 or list(rows[0][:2]) != [SCHEMA, d.norm(depot)]:
                  raise ValueError("Range history identity/schema mismatch")
              n = int(rows[0][2])
              if n < 1 or len(rows) < n+1 or any(not r or not isinstance(r[0], str) for r in rows[1:n+1]):
                  raise ValueError("Range history chunks incomplete")
              raw = "".join(r[0] for r in rows[1:n+1])
              if hashlib.sha256(raw.encode()).hexdigest() != rows[0][3]:
                  raise ValueError("Range history checksum mismatch")
              cache = json.loads(raw)
              if cache.get("schema") != SCHEMA or cache.get("depot") != d.norm(depot):
                  raise ValueError("Range history identity mismatch")
              for period, groups in cache["months"].items():
          '''.replace('              ', '')
          new = '''def decode(rows, depot):
              if not rows or len(rows[0]) < 4 or rows[0][1] != d.norm(depot):
                  raise ValueError("Range history identity/schema mismatch")
              source_schema = rows[0][0]
              if source_schema != SCHEMA and source_schema not in LEGACY_RESET_SCHEMAS:
                  raise ValueError("Range history identity/schema mismatch")
              n = int(rows[0][2])
              if n < 1 or len(rows) < n+1 or any(not r or not isinstance(r[0], str) for r in rows[1:n+1]):
                  raise ValueError("Range history chunks incomplete")
              raw = "".join(r[0] for r in rows[1:n+1])
              if hashlib.sha256(raw.encode()).hexdigest() != rows[0][3]:
                  raise ValueError("Range history checksum mismatch")
              cache = json.loads(raw)
              if cache.get("schema") != source_schema or cache.get("depot") != d.norm(depot):
                  raise ValueError("Range history identity mismatch")
              if source_schema in LEGACY_RESET_SCHEMAS:
                  print(f"RANGE_CACHE_SCHEMA_RESET {d.norm(depot)} {source_schema}->{SCHEMA}")
                  return new_cache(depot)
              for period, groups in cache["months"].items():
          '''.replace('              ', '')
          if text.count(old) != 1:
              raise SystemExit('decode() anchor changed; refusing unguarded patch')
          source.write_text(text.replace(old, new))

          Path('tests/test_kmpl_cache_migration.py').write_text('''import hashlib\nimport json\nimport unittest\n\nimport kmpl_ranges as k\n\n\ndef encode_legacy(cache, schema="kmpl-range-2"):\n    raw = json.dumps(cache, ensure_ascii=True, allow_nan=False, separators=(",", ":"))\n    chunks = [raw[i:i+30000] for i in range(0, len(raw), 30000)]\n    return [[schema, cache["depot"], len(chunks), hashlib.sha256(raw.encode()).hexdigest()]] + [[v] for v in chunks]\n\n\nclass CacheMigrationTests(unittest.TestCase):\n    def test_v2_cache_is_intentionally_reset_before_live_refetch(self):\n        legacy = {"schema": "kmpl-range-2", "depot": "PRODDUTUR",\n                  "months": {"2026-08": {"DRIVER_MONTH": {"stale": True}}}, "errors": {}}\n        self.assertEqual(k.decode(encode_legacy(legacy), "PRODDUTUR"), k.new_cache("PRODDUTUR"))\n\n    def test_unknown_schema_is_rejected(self):\n        legacy = {"schema": "kmpl-range-1", "depot": "PRODDUTUR", "months": {}, "errors": {}}\n        with self.assertRaisesRegex(ValueError, "identity/schema mismatch"):\n            k.decode(encode_legacy(legacy, "kmpl-range-1"), "PRODDUTUR")\n\n    def test_legacy_cache_checksum_and_depot_are_still_enforced(self):\n        legacy = {"schema": "kmpl-range-2", "depot": "PRODDUTUR", "months": {}, "errors": {}}\n        rows = encode_legacy(legacy)\n        rows[1][0] += "x"\n        with self.assertRaisesRegex(ValueError, "checksum mismatch"):\n            k.decode(rows, "PRODDUTUR")\n        with self.assertRaisesRegex(ValueError, "identity/schema mismatch"):\n            k.decode(encode_legacy(legacy), "RAJAMPET")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''')
          PY
      - name: Compile and test KMPL cache/range contracts
        run: |
          python -m py_compile kmpl_ranges.py monthly_vehicle_report.py
          python -m unittest tests.test_kmpl_cache_migration -v
          python -m unittest discover -s tests -p 'test_kmpl_ranges.py' -v
      - name: Commit tested code to branch
        run: |
          git config user.name 'imranshaik-pro'
          git config user.email 'imranshaik.pro@gmail.com'
          git add kmpl_ranges.py tests/test_kmpl_cache_migration.py
          git commit -m 'Handle legacy KMPL cache reset before live reconciliation'
          git push origin HEAD:fix/kmpl-v3-cache-reset-20261015
